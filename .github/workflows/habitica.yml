name: Build Habitica

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * 0"

env:
  IMAGE_NAME: ghcr.io/leanderziehm/upstream-habitica

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Habitica
        uses: actions/checkout@v4
        with:
          repository: HabitRPG/habitica
          ref: develop

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-Dev
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
